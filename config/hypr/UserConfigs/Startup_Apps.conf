# Commands and Apps to be executed at launch

# Sunshine starts via systemd --user before WAYLAND_DISPLAY is imported (configs/Startup_Apps.conf),
# so it boots with no display/encoder. Restart it here, after the import, so it picks up the session env.
exec-once = systemctl --user restart sunshine.service
