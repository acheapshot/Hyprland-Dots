# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# Commands and Apps to be executed at launch

exec-once = openrgb --startminimized --profile "Direct"

exec-once = ~/.config/hypr/UserConfigs/Scripts/start-keyring.sh
exec-once = env LD_LIBRARY_PATH=/home/acheapshot/.local/share/uv/tools/faster-whisper-dictation/lib/python3.14/site-packages/nvidia/cublas/lib:/home/acheapshot/.local/share/uv/tools/faster-whisper-dictation/lib/python3.14/site-packages/nvidia/cudnn/lib /home/acheapshot/.local/bin/faster-whisper-dictation start --engine local -b

# Sunshine starts via systemd --user before WAYLAND_DISPLAY is imported above (configs/Startup_Apps.conf),
# so it boots with no display/encoder. Restart it here, after the import, so it picks up the session env.
exec-once = systemctl --user restart sunshine.service

# Tether: start hidden in the tray (tether-gtk spawns tetherd itself)
exec-once = tether-gtk --tray
